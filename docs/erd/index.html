<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인테리어몰 ERD</title>
<meta name="description" content="인테리어 가구몰 + 커뮤니티 DB 설계 ERD (MySQL 8.0, 88개 테이블). docs/erd.dbml에서 자동 생성">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='3' fill='%232f6496'/%3E%3Cpath d='M3 12h26M12 12v15' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --line: #e1e6ec;
  --text: #1d2733;
  --muted: #607080;
  --accent: #2f6496;
  --accent-soft: #e8f0f8;
  --pk: #b8860b;
  --pk-soft: #fbf3dc;
  --fk: #2f6496;
  --fk-soft: #e3edf7;
  --uk: #6b4fa0;
  --uk-soft: #eee8f7;
  --s1: #2f8f6b;
  --s2: #2f6496;
  --s3: #b5562f;
  --s4: #a67c00;
  --s5: #7a5bb5;
  --s6: #b5407a;
  --s7: #2b8a94;
  --hl: #e8710a;
  --paper: #ffffff;
  --shadow: 0 1px 2px rgba(20, 30, 45, .06), 0 4px 16px rgba(20, 30, 45, .06);
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c;
    --panel: #19212a;
    --panel-2: #1f2832;
    --line: #2c3742;
    --text: #e3e9ef;
    --muted: #93a2b1;
    --accent: #7fb0e0;
    --accent-soft: #22344a;
    --pk: #e0b44a;
    --pk-soft: #3a3120;
    --fk: #7fb0e0;
    --fk-soft: #20324a;
    --uk: #b79be6;
    --uk-soft: #2f2742;
    --s1: #5cc79d;
    --s2: #7fb0e0;
    --s3: #e8875c;
    --s4: #e0bf5a;
    --s5: #b79be6;
    --s6: #e88cb8;
    --s7: #6cc9d2;
    --hl: #ff9a3c;
    --paper: #f3f5f8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #19212a; --panel-2: #1f2832; --line: #2c3742; --text: #e3e9ef; --muted: #93a2b1;
  --accent: #7fb0e0; --accent-soft: #22344a; --pk: #e0b44a; --pk-soft: #3a3120; --fk: #7fb0e0; --fk-soft: #20324a;
  --uk: #b79be6; --uk-soft: #2f2742; --s1: #5cc79d; --s2: #7fb0e0; --s3: #e8875c; --s4: #e0bf5a; --s5: #b79be6; --s6: #e88cb8; --s7: #6cc9d2; --hl: #ff9a3c; --paper: #f3f5f8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
button { font: inherit; color: inherit; }

/* ---------- 상단 바 ---------- */
.top {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.logo { width: 22px; height: 18px; border-radius: 4px; background: var(--accent); position: relative; }
.logo::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--panel); }
.logo::after { content: ""; position: absolute; left: 7px; top: 6px; bottom: 0; width: 2px; background: var(--panel); }
.meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.search { margin-left: auto; position: relative; width: min(360px, 100%); }
.search input {
  width: 100%;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.results {
  position: absolute;
  top: 42px;
  right: 0;
  width: 100%;
  min-width: 300px;
  max-height: 60vh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 6px;
}
.results button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.results button:hover, .results button.on { background: var(--accent-soft); }
.results .r-name { font-family: var(--mono); font-weight: 600; }
.results .r-sub { display: block; color: var(--muted); font-size: 12px; }
.results .empty { padding: 10px; color: var(--muted); }
.icon-btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 7px;
  height: 32px;
  min-width: 32px;
  padding: 0 9px;
  cursor: pointer;
}
.icon-btn:hover { background: var(--panel-2); }
.menu-btn { display: none; }

/* ---------- 레이아웃 ---------- */
.layout { display: flex; height: calc(100% - 56px); }
.side {
  width: 264px;
  flex: none;
  overflow: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 12px 10px 24px;
}
.main { flex: 1; min-width: 0; overflow: auto; position: relative; }
.scrim { display: none; }

/* ---------- 사이드바 ---------- */
.side .home {
  display: block;
  padding: 8px 10px;
  border-radius: 7px;
  font-weight: 600;
  color: var(--text);
}
.side .home.on, .side .home:hover { background: var(--accent-soft); text-decoration: none; }
.stage { margin-top: 14px; }
.stage-h {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 10px 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .02em;
}
.stage-h .dot { width: 8px; height: 8px; border-radius: 50%; }
.stage-h .n { margin-left: auto; font-weight: 500; }
.g-item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 7px;
  color: var(--text);
}
.g-item:hover { background: var(--panel-2); text-decoration: none; }
.g-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.g-item .n { color: var(--muted); font-size: 12px; font-weight: 400; }
.t-list { margin: 2px 0 8px 14px; padding-left: 8px; border-left: 2px solid var(--line); }
.t-list a {
  display: block;
  padding: 3px 8px;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--muted);
}
.t-list a:hover { color: var(--text); background: var(--panel-2); text-decoration: none; }
.t-list a.on { color: var(--hl); font-weight: 600; }

/* ---------- 개요 ---------- */
.overview { padding: 28px 28px 40px; }
.overview h1 { font-size: 24px; margin: 0 0 6px; }
.overview .lead { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
.stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
.stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 16px;
  min-width: 140px;
}
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12.5px; }
.ov-h { font-size: 17px; margin: 26px 0 4px; display: flex; align-items: baseline; gap: 10px; }
.ov-h span { color: var(--muted); font-size: 13px; font-weight: 400; }
.ov-sub { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.ov-erd { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
.ov-erd .toolbar { border-top: 0; padding: 8px 14px; }
.ov-erd .canvas { border-bottom: 0; }
.canvas g.cluster { cursor: pointer; }
.canvas g.cluster:hover > path, .canvas g.cluster:hover > polygon { stroke-width: 2.4; }
.stage-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1500px) { .stage-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stage-col {
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 4px solid var(--c);
  border-radius: 10px;
  padding: 14px;
  box-shadow: var(--shadow);
}
.stage-col h2 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; }
.stage-col h2 span { color: var(--muted); font-weight: 500; font-size: 13px; }
.g-card {
  display: block;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  margin-top: 10px;
  background: var(--panel-2);
  color: var(--text);
}
.g-card:hover { border-color: var(--c); text-decoration: none; }
.g-card b { display: block; }
.g-card p { margin: 3px 0 8px; color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--muted);
}
.legend {
  margin-top: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 18px;
}
.legend h3 { margin: 0 0 8px; font-size: 14px; }
.legend ul { margin: 0; padding-left: 18px; color: var(--muted); }
.legend li { margin: 3px 0; }

/* ---------- 영역 화면: ERD ---------- */
.g-view { padding-bottom: 48px; }
.g-head { padding: 18px 22px 12px; }
.g-head .crumb { font-size: 12px; font-weight: 700; color: var(--c); }
.g-head h1 { font-size: 20px; margin: 2px 0 4px; }
.g-head p { margin: 0; color: var(--muted); max-width: 900px; }
.g-head .ext { font-size: 12.5px; margin-top: 6px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.jump a {
  font-family: var(--mono);
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
}
.jump a:hover { border-color: var(--c); text-decoration: none; }
.jump a.on { border-color: var(--hl); color: var(--hl); font-weight: 600; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 22px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex-wrap: wrap;
}
.toolbar .zoom { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.toolbar .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
.canvas {
  height: 62vh;
  min-height: 200px;
  overflow: auto;
  resize: vertical;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  cursor: grab;
  position: relative;
}
.canvas.drag { cursor: grabbing; user-select: none; }
.canvas .pad { padding: 24px; display: inline-block; min-width: 100%; }
.canvas svg { display: block; margin: 0 auto; }
.canvas svg text[font-family="Consolas"] { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; }
.canvas svg text[font-family="Malgun Gothic"] { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
.canvas g.node { cursor: pointer; }
.canvas g.node text { cursor: help; }
.canvas g.node:hover polygon[fill="none"] { stroke-width: 2.5; }
.canvas.has-sel g.node:not(.sel):not(.rel) { opacity: .35; }
.canvas.has-sel g.edge:not(.rel) { opacity: .15; }
.canvas g.node.sel polygon[fill="none"] { stroke: #e8710a; stroke-width: 3; }
.canvas g.edge.rel path { stroke: #e8710a; stroke-width: 2; }
.canvas g.edge.rel polygon, .canvas g.edge.rel polyline, .canvas g.edge.rel ellipse { stroke: #e8710a; }

/* ---------- ERD 마우스 팝업 (테이블 기능 설명) ---------- */
.tip {
  position: fixed;
  z-index: 60;
  max-width: min(380px, calc(100vw - 16px));
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 6px 24px rgba(20, 30, 45, .18);
  padding: 10px 12px;
  font-size: 12.5px;
  line-height: 1.5;
  pointer-events: none;
}
.tip-h { display: flex; align-items: baseline; gap: 8px; }
.tip-h code { font-size: 13.5px; font-weight: 700; }
.tip-h span { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tip-note { margin: 4px 0 0; }
.tip-col, .tip-list, .tip-foot { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.tip-col code { font-weight: 600; }
.tip-type { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.tip-ref { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
.tip-list { list-style: none; padding-left: 0; margin-bottom: 0; }
.tip-list li { padding: 1px 0; }
.tip-more, .tip-foot { color: var(--muted); font-size: 11.5px; }
.tip .badge { margin-right: 0; }

/* ---------- 영역 화면: 테이블 명세 ---------- */
.specs { padding: 8px 22px 0; }
.specs-h { font-size: 16px; margin: 18px 0 4px; }
.spec {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-top: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  scroll-margin-top: 12px;
}
.spec.sel { border-color: var(--hl); box-shadow: 0 0 0 2px var(--hl), var(--shadow); }
.spec-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 0;
  flex-wrap: wrap;
}
.spec-h .no {
  min-width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--c);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.spec-h h3 { margin: 0; font-family: var(--mono); font-size: 16px; word-break: break-all; }
.spec-h .cnt { color: var(--muted); font-size: 12.5px; }
.spec-h .to-erd { margin-left: auto; font-size: 12px; height: 28px; }
.spec .tnote { margin: 6px 16px 10px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
.cols { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cols th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  background: var(--panel-2);
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.cols td { border-top: 1px solid var(--line); padding: 7px 10px; vertical-align: top; }
.cols tbody tr:first-child td { border-top: 0; }
.cols tr.is-pk td { background: color-mix(in srgb, var(--pk-soft) 55%, transparent); }
.cols tbody tr:hover td { background: var(--accent-soft); }
.cols .c-name { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.cols .c-type { font-family: var(--mono); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.cols .c-key { white-space: nowrap; }
.cols .c-nn { text-align: center; color: var(--muted); }
.cols .c-def { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.cols .c-desc { min-width: 260px; line-height: 1.5; }
.cols .c-ref { font-size: 11.5px; margin-bottom: 2px; }
.cols .c-ref code { font-size: 11.5px; }
.badge {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  padding: 0 5px;
  border-radius: 4px;
  margin-right: 3px;
  line-height: 17px;
}
.badge.PK { color: var(--pk); background: var(--pk-soft); }
.badge.FK { color: var(--fk); background: var(--fk-soft); }
.badge.UK { color: var(--uk); background: var(--uk-soft); }
.badge.AI { color: var(--s1); background: var(--panel-2); border: 1px solid var(--line); line-height: 15px; }
.spec-foot {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 4px 24px;
  padding: 4px 16px 12px;
  border-top: 1px solid var(--line);
  background: var(--panel-2);
  font-size: 12.5px;
}
.spec-foot:empty { display: none; }
.spec-foot h4 { margin: 8px 0 4px; font-size: 12px; color: var(--muted); }
.spec-foot ul { margin: 0; padding: 0; list-style: none; }
.spec-foot li { padding: 2px 0; }
.spec-foot code { font-size: 12px; }
.spec-foot .cols-of { color: var(--muted); }
.i-note { color: var(--muted); }

/* ---------- 좁은 화면 ---------- */
@media (max-width: 1100px) {
  .stage-cols { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .menu-btn { display: inline-block; }
  .meta { display: none; }
  .top { gap: 10px; }
  .brand span:last-child { display: none; }
  .side {
    position: fixed;
    top: 56px;
    left: 0;
    bottom: 0;
    z-index: 30;
    transform: translateX(-100%);
    transition: transform .2s;
    box-shadow: var(--shadow);
  }
  body.side-open .side { transform: none; }
  body.side-open .scrim {
    display: block;
    position: fixed;
    inset: 56px 0 0 0;
    background: rgba(0, 0, 0, .3);
    z-index: 25;
  }
  .overview { padding: 20px 16px 32px; }
  .g-head { padding: 14px 16px 8px; }
  .toolbar { padding: 8px 16px; }
  .toolbar .hint { display: none; }
  .specs { padding: 4px 16px 0; }
  .spec-h { padding: 10px 12px 0; }
  .spec .tnote { margin: 6px 12px 10px; }
  /* 컬럼 표 → 행마다 카드형으로 쌓기 (설명이 가로 스크롤 밖으로 밀리지 않게) */
  .tbl-wrap { overflow: visible; }
  .cols thead { display: none; }
  .cols, .cols tbody { display: block; }
  .cols tr { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .cols tbody tr:first-child { border-top: 0; }
  .cols tr.is-pk { background: color-mix(in srgb, var(--pk-soft) 55%, transparent); }
  .cols td, .cols tr.is-pk td, .cols tbody tr:hover td { border: 0; padding: 0; background: none; }
  .cols .c-type { text-align: right; }
  .cols .c-nn { display: none; }
  .cols .c-key:empty, .cols .c-def:empty, .cols .c-desc:empty { display: none; }
  .cols .c-def { grid-column: 1 / -1; }
  .cols .c-def::before { content: '기본값 '; font-family: inherit; }
  .cols .c-desc { grid-column: 1 / -1; min-width: 0; }
  .results { min-width: 0; }
}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="영역 목록 열기">☰</button>
  <a class="brand" href="#" aria-label="개요로 이동"><span class="logo"></span><span>인테리어몰 ERD</span></a>
  <span class="meta">MySQL 8.0 · 테이블 88 · 관계 162</span>
  <div class="search">
    <input id="q" type="search" placeholder="테이블·컬럼 검색 (예: sku, stock)" autocomplete="off" aria-label="테이블·컬럼 검색">
    <div id="results" class="results" hidden></div>
  </div>
</header>
<div class="layout">
  <nav class="side" id="side" aria-label="영역 목록"></nav>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim" hidden></div>

<script>(function () {
  'use strict';
  const D = window.ERD;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const side = $('#side'), main = $('#main'), q = $('#q'), results = $('#results');

  const stageOf = (g) => D.stages.findIndex((s) => g.startsWith(s.prefix + '_'));
  const stageColor = (g) => `var(--s${stageOf(g) + 1})`;
  const PT = 4 / 3; // Graphviz pt → px

  let cur = { g: null, t: null };
  const zoomOf = {}; // 영역별 확대 비율 유지
  const manual = {}; // 사용자가 직접 확대/축소한 영역 (아니면 창 크기·상세 패널에 맞춰 다시 맞춤)

  // ---------- 라우팅: #g=영역&t=테이블 / #t=테이블 / (없음)=개요 ----------
  function parseHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    let g = p.get('g'), t = p.get('t');
    if (t && !D.tables[t]) t = null;
    if (g && !D.groups[g]) g = null;
    if (t && !g) g = D.tables[t].group;
    return { g, t };
  }
  function go(g, t) {
    const h = g ? `#g=${g}${t ? `&t=${t}` : ''}` : t ? `#t=${t}` : '#';
    if (location.hash === h || (h === '#' && !location.hash)) route();
    else location.hash = h;
  }
  function route() {
    const next = parseHash();
    const groupChanged = next.g !== cur.g || !main.firstChild;
    cur = next;
    if (groupChanged) next.g ? renderGroup(next.g) : renderOverview();
    renderSide();
    selectTable(next.t);
    document.body.classList.remove('side-open');
  }

  // ---------- 사이드바 ----------
  function renderSide() {
    let h = `<a class="home${cur.g ? '' : ' on'}" href="#">전체 개요</a>`;
    D.stages.forEach((s, i) => {
      const n = s.groups.reduce((a, g) => a + D.groups[g].tables.length, 0);
      h += `<div class="stage"><div class="stage-h"><span class="dot" style="background:var(--s${i + 1})"></span>${esc(s.name)}<span class="n">${n}개</span></div>`;
      s.groups.forEach((g) => {
        const G = D.groups[g];
        const on = g === cur.g;
        h += `<a class="g-item${on ? ' on' : ''}" href="#g=${g}"><span>${esc(G.title)}</span><span class="n">${G.tables.length}</span></a>`;
        if (on) {
          h += `<div class="t-list">${G.tables.map((t) => `<a href="#g=${g}&t=${t}" class="${t === cur.t ? 'on' : ''}">${t}</a>`).join('')}</div>`;
        }
      });
      h += '</div>';
    });
    side.innerHTML = h;
    const on = $('.g-item.on', side);
    if (on && on.scrollIntoViewIfNeeded) on.scrollIntoViewIfNeeded(false);
  }

  // ---------- 개요 ----------
  function renderOverview() {
    view = null;
    let cols = '';
    D.stages.forEach((s, i) => {
      const n = s.groups.reduce((a, g) => a + D.groups[g].tables.length, 0);
      cols += `<section class="stage-col" style="--c:var(--s${i + 1})"><h2>${esc(s.name)}<span>${n}개 테이블</span></h2>`;
      s.groups.forEach((g) => {
        const G = D.groups[g];
        cols += `<a class="g-card" href="#g=${g}"><b>${esc(G.title)} <span class="n" style="color:var(--muted);font-weight:400">· ${G.tables.length}</span></b>
          <p>${esc(G.desc)}</p><div class="chips">${G.tables.map((t) => `<span>${t}</span>`).join('')}</div></a>`;
      });
      cols += '</section>';
    });
    main.innerHTML = `<div class="overview">
      <h1>인테리어 가구몰 + 커뮤니티 ERD</h1>
      <p class="lead">여러 브랜드 가구를 자사가 직접 판매하는 쇼핑몰(장바구니·주문·결제·설치배송 포함)과 구매 고객 사진·집들이·브랜드 매거진 커뮤니티의 DB 설계입니다.
        영역을 고르면 ERD가 열리고, 테이블을 누르면 전체 컬럼과 관계를 볼 수 있습니다.</p>
      <div class="stats">
        <div class="stat"><b>${D.counts.tables}</b><span>테이블</span></div>
        <div class="stat"><b>${D.counts.refs}</b><span>FK 관계</span></div>
        <div class="stat"><b>${D.counts.groups}</b><span>영역</span></div>
        <div class="stat"><b>MySQL 8.0</b><span>InnoDB · utf8mb4</span></div>
      </div>
      <h2 class="ov-h">전체 구조 <span>${D.counts.tables}개 테이블 · 영역별 묶음</span></h2>
      <p class="ov-sub">테이블 이름만 표시한 전체 관계도입니다. 색은 영역(고객 · 상품 · 커뮤니티 · 장바구니 · 주문 · 결제 · 배송), 선은 FK(까마귀발 쪽이 여러 개). 관리자 감사 컬럼(created_by 등) 선은 생략했습니다.</p>
      <div class="ov-erd">
        ${toolbarHtml('테이블·영역에 마우스를 올리면 설명 · 누르면 그 영역으로 이동 · 드래그로 이동 · Ctrl + 휠로 확대')}
        <div class="canvas" id="canvas"><div class="pad"></div></div>
      </div>
      <h2 class="ov-h">영역별 보기</h2>
      <div class="stage-cols">${cols}</div>
      <div class="legend"><h3>ERD 읽는 법</h3><ul>
        <li>각 영역 ERD에는 키 컬럼(PK·FK·UK)만 보이고, 나머지는 <b>+ N columns</b>로 줄여 표시합니다. 테이블을 누르면 전체 컬럼이 나옵니다.</li>
        <li>선 끝 모양: 까마귀발 = 여러 개(N), 세로줄 = 반드시 1개, 동그라미 = 없을 수 있음(0).</li>
        <li>회색 테이블은 다른 영역에 있는 참조 대상입니다 (PK만 표시).</li>
        <li>고객 외 영역 ERD에서는 관리자 감사 컬럼(created_by 등) → member_account 선을 생략했습니다. 상세 패널에는 FK로 표시됩니다.</li>
        <li>원본: <code>docs/erd.dbml</code> (dbdiagram.io 형식). 이 페이지는 <code>tools/design-doc</code>의 <code>npm run erd</code>로 생성됩니다.</li>
      </ul></div>
    </div>`;
    mountDiagram('__all');
    main.scrollTop = 0;
  }

  // ---------- 영역 화면: ERD + 테이블 명세 ----------
  let view = null; // { svg, w, h, canvas, zoomEl, g }
  const link = (name, col) => `<a href="#g=${D.tables[name].group}&t=${name}"><code>${name}</code></a>${col ? `<code>.${esc(col)}</code>` : ''}`;
  const keyBadges = (f) => f.keys.map((k) => `<span class="badge ${k}">${k}</span>`).join('') + (f.inc ? '<span class="badge AI">AI</span>' : '');

  function specCard(t, no) {
    const T = D.tables[t];
    const rows = T.fields.map((f) => `<tr class="${f.keys.includes('PK') ? 'is-pk' : ''}">
        <td class="c-name">${esc(f.name)}</td>
        <td class="c-type">${esc(f.type)}</td>
        <td class="c-key">${keyBadges(f)}</td>
        <td class="c-nn">${f.nn ? 'Y' : ''}</td>
        <td class="c-def">${esc(f.def)}</td>
        <td class="c-desc">${f.ref ? `<div class="c-ref">→ ${link(f.ref.split('.')[0], f.ref.split('.')[1])}</div>` : ''}${esc(f.note)}</td></tr>`).join('');
    const idx = T.indexes.map((i) => `<li><code>${esc(i.pk ? 'PRIMARY' : i.name)}</code> ${i.pk ? '<span class="badge PK">PK</span>' : i.unique ? '<span class="badge UK">UNIQUE</span>' : ''}
        <code class="cols-of">(${esc(i.cols)})</code>${i.note ? ` <span class="i-note">${esc(i.note)}</span>` : ''}</li>`).join('');
    const outs = T.out.map((r) => `<li><code>${esc(r.col)}</code> → ${link(r.table, r.pcol)}${r.one ? ' <span class="i-note">1:1</span>' : ''}</li>`).join('');
    const ins = T.in.map((r) => `<li>${link(r.table, r.col)}${r.one ? ' <span class="i-note">1:1</span>' : ''}</li>`).join('');
    return `<section class="spec" id="spec-${t}">
      <header class="spec-h">
        <span class="no">${no}</span>
        <h3>${t}</h3>
        <span class="cnt">컬럼 ${T.fields.length}</span>
        <button class="icon-btn to-erd" data-erd="${t}">ERD에서 보기 ↑</button>
      </header>
      <p class="tnote">${esc(T.note)}</p>
      <div class="tbl-wrap"><table class="cols">
        <thead><tr><th>컬럼</th><th>타입</th><th>키</th><th>NN</th><th>기본값</th><th>설명</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="spec-foot">
        ${idx ? `<div><h4>인덱스</h4><ul>${idx}</ul></div>` : ''}
        ${outs ? `<div><h4>참조하는 테이블</h4><ul>${outs}</ul></div>` : ''}
        ${ins ? `<div><h4>참조받는 테이블</h4><ul>${ins}</ul></div>` : ''}
      </div>
    </section>`;
  }

  function renderGroup(g) {
    const G = D.groups[g];
    const s = D.stages[stageOf(g)];
    main.innerHTML = `<div class="g-view" style="--c:${stageColor(g)}">
      <div class="g-head">
        <div class="crumb">${esc(s.name)}</div>
        <h1>${esc(G.title)} <span style="color:var(--muted);font-weight:400;font-size:15px">${G.tables.length}개 테이블</span></h1>
        <p>${esc(G.desc)}</p>
        ${G.ext.length ? `<p class="ext">다른 영역 참조(회색): ${G.ext.map((t) => link(t)).join(', ')}${G.hideAudit ? ' · 관리자 감사 컬럼 → member_account 선 생략' : ''}</p>` : ''}
        <nav class="jump" aria-label="테이블 명세 바로가기">${G.tables.map((t) => `<a href="#g=${g}&t=${t}">${t}</a>`).join('')}</nav>
      </div>
      ${toolbarHtml('테이블·컬럼에 마우스를 올리면 설명 · 테이블을 누르면 아래 명세로 이동 · 드래그로 이동 · Ctrl + 휠로 확대')}
      <div class="canvas" id="canvas"><div class="pad"></div></div>
      <div class="specs"><h2 class="specs-h">테이블 명세</h2>${G.tables.map((t, i) => specCard(t, i + 1)).join('')}</div>
    </div>`;
    mountDiagram(g);
    main.scrollTop = 0;
  }
  function toolbarHtml(hint) {
    return `<div class="toolbar">
        <button class="icon-btn" data-z="out" aria-label="축소">−</button>
        <span class="zoom" id="zoomVal">100%</span>
        <button class="icon-btn" data-z="in" aria-label="확대">+</button>
        <button class="icon-btn" data-z="fit">화면 맞춤</button>
        <button class="icon-btn" data-z="one">100%</button>
        <span class="hint">${hint}</span>
      </div>`;
  }
  // #canvas에 svg-{key} 템플릿을 붙이고 노드·선·영역 묶음에 테이블/영역 이름을 표시
  function mountDiagram(key) {
    const canvas = $('#canvas');
    const tpl = document.getElementById(`svg-${key}`);
    $('.pad', canvas).appendChild(tpl.content.cloneNode(true));
    const svg = $('svg', canvas);
    const vb = svg.viewBox.baseVal;
    view = { svg, w: vb.width, h: vb.height, canvas, zoomEl: $('#zoomVal'), g: key };
    svg.querySelectorAll('g.cluster').forEach((c) => {
      const ti = $('title', c);
      if (ti) c.dataset.g = ti.textContent.trim().replace(/^cluster_/, '');
    });
    svg.querySelectorAll('g.node').forEach((n) => {
      const t = $('title', n).textContent.trim();
      n.dataset.t = t;
      const T = D.tables[t];
      if (!T) return;
      // 마우스 팝업용 표시: 컬럼 이름 텍스트 → data-col, "+ N columns" → data-more
      const texts = [...n.querySelectorAll('text')];
      texts.forEach((tx) => {
        const name = tx.textContent.trim();
        if (T.fields.some((x) => x.name === name)) tx.dataset.col = name;
        else if (/^\+ \d+ columns$/.test(name)) tx.dataset.more = '1';
      });
      n.dataset.shown = texts.filter((tx) => tx.dataset.col).map((tx) => tx.dataset.col).join(',');
    });
    svg.querySelectorAll('g.edge').forEach((e) => {
      const [a, b] = $('title', e).textContent.split('->');
      e.dataset.a = a.split(':')[0].trim();
      e.dataset.b = b.split(':')[0].trim();
    });
    // 브라우저 기본 툴팁(SVG title) 대신 마우스 팝업을 쓰므로 제거
    svg.querySelectorAll('title').forEach((ti) => ti.remove());
    if (zoomOf[key]) setZoom(zoomOf[key]); else fit();
  }
  // 긴 설명은 첫 문장(마침표·괄호 전)까지만
  function shortNote(s) {
    const t = s.split(/\. |\n/)[0];
    return t.length > 60 ? t.slice(0, 58) + '…' : t;
  }
  function maxCanvasH() { return Math.max(320, Math.round(window.innerHeight * (view && view.g === '__all' ? 0.8 : 0.62))); }
  function setZoom(z) {
    if (!view) return;
    z = Math.max(0.2, Math.min(3, z));
    zoomOf[view.g] = z;
    view.svg.style.width = `${view.w * PT * z}px`;
    view.svg.style.height = `${view.h * PT * z}px`;
    view.zoomEl.textContent = `${Math.round(z * 100)}%`;
  }
  function fit() {
    if (!view) return;
    const c = view.canvas;
    const z = Math.min((c.clientWidth - 48) / (view.w * PT), (maxCanvasH() - 48) / (view.h * PT), 1.2);
    setZoom(z > 0 ? z : 1);
    // 작은 ERD는 캔버스 높이를 그림에 맞춰 줄여서 아래 명세가 바로 보이게
    c.style.height = `${Math.min(maxCanvasH(), Math.ceil(view.h * PT * zoomOf[view.g]) + 48)}px`;
  }
  function refit() { if (view && !manual[view.g]) fit(); }
  function zoomAt(z, cx, cy) {
    // cx, cy: 캔버스 안 좌표. 그 지점이 제자리에 있도록 스크롤 보정
    const c = view.canvas, old = zoomOf[view.g];
    const x = (c.scrollLeft + cx), y = (c.scrollTop + cy);
    setZoom(z);
    const k = zoomOf[view.g] / old;
    c.scrollLeft = x * k - cx;
    c.scrollTop = y * k - cy;
  }

  main.addEventListener('click', (e) => {
    const toErd = e.target.closest('[data-erd]');
    if (toErd) {
      main.scrollTo({ top: 0, behavior: 'smooth' });
      highlight(toErd.dataset.erd);
      return;
    }
    const b = e.target.closest('[data-z]');
    if (!b || !view) return;
    const z = zoomOf[view.g];
    const c = view.canvas;
    manual[view.g] = b.dataset.z !== 'fit';
    if (b.dataset.z === 'in') zoomAt(z * 1.25, c.clientWidth / 2, c.clientHeight / 2);
    if (b.dataset.z === 'out') zoomAt(z / 1.25, c.clientWidth / 2, c.clientHeight / 2);
    if (b.dataset.z === 'fit') fit();
    if (b.dataset.z === 'one') setZoom(1);
  });
  main.addEventListener('wheel', (e) => {
    if (!view || !(e.ctrlKey || e.metaKey) || !e.target.closest('.canvas')) return;
    e.preventDefault();
    manual[view.g] = true;
    const r = view.canvas.getBoundingClientRect();
    zoomAt(zoomOf[view.g] * (e.deltaY < 0 ? 1.12 : 1 / 1.12), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  // 드래그 이동 (조금만 움직이면 클릭으로 처리)
  let drag = null;
  main.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.canvas');
    if (!c || e.button !== 0) return;
    drag = { c, x: e.clientX, y: e.clientY, sl: c.scrollLeft, st: c.scrollTop, moved: false };
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; drag.c.classList.add('drag'); }
    if (drag.moved) { drag.c.scrollLeft = drag.sl - dx; drag.c.scrollTop = drag.st - dy; }
  });
  window.addEventListener('pointerup', (e) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    d.c.classList.remove('drag');
    if (d.moved) return;
    const n = e.target.closest && e.target.closest('g.node');
    // 이 영역 테이블은 아래 명세로, 회색(다른 영역) 테이블은 그 영역으로 이동
    const cl = !n && e.target.closest && e.target.closest('g.cluster');
    if (n && n.dataset.t && D.tables[n.dataset.t]) go(D.tables[n.dataset.t].group, n.dataset.t);
    else if (cl && cl.dataset.g && D.groups[cl.dataset.g]) go(cl.dataset.g, null);
    else if (e.target.closest && e.target.closest('.canvas')) highlight(null);
  });

  // ---------- 마우스를 따라다니는 테이블 설명 팝업 ----------
  const tipEl = document.createElement('div');
  tipEl.className = 'tip';
  tipEl.hidden = true;
  document.body.appendChild(tipEl);
  let tipKey = '';
  function tipHtml(n, tx) {
    const T = D.tables[n.dataset.t];
    if (!T) return '';
    const G = D.groups[T.group];
    let h = `<div class="tip-h"><code>${T.name}</code><span>${esc(G.title)}</span></div>
      <p class="tip-note">${esc(T.note)}</p>`;
    if (tx && tx.dataset.col) {
      const f = T.fields.find((x) => x.name === tx.dataset.col);
      h += `<div class="tip-col"><div><code>${esc(f.name)}</code> <span class="tip-type">${esc(f.type)}</span>${f.keys.map((k) => ` <span class="badge ${k}">${k}</span>`).join('')}</div>
        ${f.ref ? `<div class="tip-ref">→ ${esc(f.ref)}</div>` : ''}${f.note ? `<div>${esc(f.note)}</div>` : ''}</div>`;
    } else if (tx && tx.dataset.more) {
      const shown = new Set((n.dataset.shown || '').split(','));
      const rest = T.fields.filter((f) => !shown.has(f.name));
      h += `<ul class="tip-list">${rest.slice(0, 14).map((f) => `<li><code>${esc(f.name)}</code>${f.note ? ` — ${esc(shortNote(f.note))}` : ''}</li>`).join('')}
        ${rest.length > 14 ? `<li class="tip-more">외 ${rest.length - 14}개</li>` : ''}</ul>`;
    } else {
      h += `<div class="tip-foot">컬럼 ${T.fields.length}개 · 컬럼에 올리면 컬럼 설명 · 누르면 ${T.group === (view && view.g) ? '아래 명세로 이동' : '해당 영역으로 이동'}</div>`;
    }
    return h;
  }
  function placeTip(x, y) {
    const pad = 14, r = tipEl.getBoundingClientRect();
    let left = x + pad, top = y + pad + 4;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - pad;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - pad;
    tipEl.style.left = `${Math.max(8, left)}px`;
    tipEl.style.top = `${Math.max(8, top)}px`;
  }
  function hideTip() { tipEl.hidden = true; tipKey = ''; }
  main.addEventListener('mousemove', (e) => {
    const n = !drag && e.target.closest && e.target.closest('.canvas g.node');
    if (!n || !n.dataset.t) {
      // 전체 구조도의 영역 묶음 위: 영역 설명
      const cl = !drag && e.target.closest && e.target.closest('.canvas g.cluster');
      const G = cl && D.groups[cl.dataset.g];
      if (!G) { hideTip(); return; }
      const key = `group|${cl.dataset.g}`;
      if (key !== tipKey) {
        tipKey = key;
        tipEl.innerHTML = `<div class="tip-h"><code>${esc(G.title)}</code><span>${esc(D.stages[stageOf(cl.dataset.g)].name)}</span></div>
          <p class="tip-note">${esc(G.desc)}</p><div class="tip-foot">테이블 ${G.tables.length}개 · 누르면 이 영역의 ERD와 명세로 이동</div>`;
      }
      tipEl.hidden = false;
      placeTip(e.clientX, e.clientY);
      return;
    }
    const tx = e.target.closest('text[data-col], text[data-more]');
    const key = `${n.dataset.t}|${tx ? tx.dataset.col || 'more' : ''}`;
    if (key !== tipKey) { tipKey = key; tipEl.innerHTML = tipHtml(n, tx); }
    tipEl.hidden = false;
    placeTip(e.clientX, e.clientY);
  });
  main.addEventListener('mouseleave', hideTip);
  main.addEventListener('scroll', hideTip, true);

  // ---------- 선택 ----------
  function highlight(t) {
    if (!view) return;
    const svg = view.svg;
    view.canvas.classList.toggle('has-sel', !!t);
    svg.querySelectorAll('g.node').forEach((n) => { n.classList.toggle('sel', n.dataset.t === t); n.classList.remove('rel'); });
    svg.querySelectorAll('g.edge').forEach((e) => {
      const rel = !!t && (e.dataset.a === t || e.dataset.b === t);
      e.classList.toggle('rel', rel);
      if (rel) svg.querySelectorAll('g.node').forEach((n) => {
        if (n.dataset.t === e.dataset.a || n.dataset.t === e.dataset.b) n.classList.add('rel');
      });
    });
    const n = t && svg.querySelector(`g.node[data-t="${t}"]`);
    if (n) {
      // 캔버스 밖이면 캔버스 안에서만 스크롤해서 보이게
      const c = view.canvas, r = n.getBoundingClientRect(), cr = c.getBoundingClientRect();
      if (r.left < cr.left || r.right > cr.right || r.top < cr.top || r.bottom > cr.bottom) {
        c.scrollLeft += r.left + r.width / 2 - (cr.left + cr.width / 2);
        c.scrollTop += r.top + r.height / 2 - (cr.top + cr.height / 2);
      }
    }
  }

  function selectTable(t) {
    highlight(t);
    main.querySelectorAll('.spec.sel').forEach((el) => el.classList.remove('sel'));
    main.querySelectorAll('.jump a').forEach((a) => a.classList.toggle('on', a.textContent === t));
    if (!t) return;
    const card = document.getElementById(`spec-${t}`);
    if (!card) return;
    card.classList.add('sel');
    main.scrollTo({ top: card.offsetTop - 12, behavior: 'smooth' });
  }

  // ---------- 검색 ----------
  let hits = [], hitOn = 0;
  function search() {
    const s = q.value.trim().toLowerCase();
    if (!s) { results.hidden = true; return; }
    hits = [];
    Object.values(D.tables).forEach((T) => {
      const g = D.groups[T.group].title;
      if (T.name.includes(s)) hits.push({ t: T.name, score: T.name.startsWith(s) ? 0 : 1, sub: g });
      else {
        const cols = T.fields.filter((f) => f.name.includes(s)).map((f) => f.name);
        if (cols.length) hits.push({ t: T.name, score: 2, sub: `${g} · 컬럼 ${cols.slice(0, 4).join(', ')}${cols.length > 4 ? ' …' : ''}` });
        else if (T.note.toLowerCase().includes(s)) hits.push({ t: T.name, score: 3, sub: `${g} · ${T.note.slice(0, 50)}` });
      }
    });
    hits.sort((a, b) => a.score - b.score || a.t.localeCompare(b.t));
    hits = hits.slice(0, 40);
    hitOn = 0;
    results.innerHTML = hits.length
      ? hits.map((h, i) => `<button data-i="${i}" class="${i === 0 ? 'on' : ''}"><span class="r-name">${h.t}</span><span class="r-sub">${esc(h.sub)}</span></button>`).join('')
      : '<div class="empty">일치하는 테이블이 없습니다</div>';
    results.hidden = false;
  }
  function pick(i) {
    const h = hits[i];
    if (!h) return;
    results.hidden = true;
    q.blur();
    go(D.tables[h.t].group, h.t);
  }
  q.addEventListener('input', search);
  q.addEventListener('focus', search);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      hitOn = (hitOn + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(hits.length, 1);
      results.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === hitOn));
      const on = results.querySelector('button.on');
      if (on) on.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') pick(hitOn);
    else if (e.key === 'Escape') { results.hidden = true; q.blur(); }
  });
  results.addEventListener('mousedown', (e) => {
    const b = e.target.closest('button[data-i]');
    if (b) { e.preventDefault(); pick(+b.dataset.i); }
  });
  q.addEventListener('blur', () => setTimeout(() => (results.hidden = true), 100));

  // ---------- 기타 ----------
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
  $('#menuBtn').onclick = () => document.body.classList.toggle('side-open');
  $('#scrim').onclick = () => document.body.classList.remove('side-open');
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { refit(); }, 150); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
