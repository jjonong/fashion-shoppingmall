<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패션 쇼핑몰 ERD</title>
<meta name="description" content="패션 브랜드 입점형 쇼핑몰 DB 설계 ERD (MySQL 8.0, 36개 테이블). docs/erd.dbml에서 자동 생성">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='3' fill='%232f6496'/%3E%3Cpath d='M3 12h26M12 12v15' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('erd-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>:root {
  /* W컨셉 무드: 흰 바탕 · 검정 글자 · 가는 회색 선 · 모서리 없음 · 색은 최소 */
  --bg: #ffffff;
  --panel: #ffffff;
  --panel-2: #f6f6f6;
  --content: #f5f5f5;   /* 콘텐츠 영역 미색 (눈부심 완화) */
  --content-2: #ebebeb; /* 콘텐츠 영역 안의 옅은 강조 (PK 행·칩) */
  --row-hover: #f7f7f7; /* 명세 표 행 hover (PK 행보다 옅게) */
  --line: #e6e6e6;
  --line-strong: #111111;
  --text: #111111;
  --muted: #8a8a8a;
  --sub: #555555;
  --accent: #111111;
  --accent-soft: #f2f2f2;
  --on-accent: #ffffff;
  --pk: #ffffff;
  --pk-soft: #111111;
  --fk: #111111;
  --fk-soft: #ffffff;
  --uk: #555555;
  --uk-soft: #ececec;
  /* 영역 포인트 색: 채도를 낮춘 톤 (고객 슬레이트 블루 · 브랜드 카키 · 상품 세이지 · 주문 테라코타 · 운영 그래파이트) */
  --s1: #4f6378;
  --s2: #7d6c4f;
  --s3: #5e7663;
  --s4: #8e5d4c;
  --s5: #4d4d57;
  --s6: #999999;
  --s7: #111111;
  --s8: #555555;
  --hl: #111111;
  --paper: #ffffff;
  --shadow: none;
  --mono: Consolas, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0f; --panel: #0f0f0f; --panel-2: #1a1a1a; --content: #0f0f0f; --content-2: #1a1a1a; --row-hover: #151515; --line: #2a2a2a; --line-strong: #f2f2f2;
    --text: #f2f2f2; --muted: #9a9a9a; --sub: #bdbdbd; --accent: #f2f2f2; --accent-soft: #1f1f1f; --on-accent: #111111;
    --pk: #111111; --pk-soft: #f2f2f2; --fk: #f2f2f2; --fk-soft: #0f0f0f; --uk: #bbbbbb; --uk-soft: #262626;
    --s1: #93a8bd; --s2: #bfad8a; --s3: #98b29d; --s4: #cd9886; --s5: #a3a3ad; --s6: #777777; --s7: #f2f2f2; --s8: #bbbbbb;
    --hl: #f2f2f2; --paper: #f4f4f4; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0f0f0f; --panel: #0f0f0f; --panel-2: #1a1a1a; --content: #0f0f0f; --content-2: #1a1a1a; --row-hover: #151515; --line: #2a2a2a; --line-strong: #f2f2f2;
    --text: #f2f2f2; --muted: #9a9a9a; --sub: #bdbdbd; --accent: #f2f2f2; --accent-soft: #1f1f1f; --on-accent: #111111;
    --pk: #111111; --pk-soft: #f2f2f2; --fk: #f2f2f2; --fk-soft: #0f0f0f; --uk: #bbbbbb; --uk-soft: #262626;
    --s1: #93a8bd; --s2: #bfad8a; --s3: #98b29d; --s4: #cd9886; --s5: #a3a3ad; --s6: #777777; --s7: #f2f2f2; --s8: #bbbbbb;
    --hl: #f2f2f2; --paper: #f4f4f4; --shadow: none;
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 "Pretendard Variable", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  overflow: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
button { font: inherit; color: inherit; }

/* ---------- 상단 바 ---------- */
.top {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.logo { width: 22px; height: 18px; border-radius: 0; background: var(--accent); position: relative; }
.logo::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--panel); }
.logo::after { content: ""; position: absolute; left: 7px; top: 6px; bottom: 0; width: 2px; background: var(--panel); }
.meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.search { margin-left: auto; position: relative; width: min(360px, 100%); }
.search input {
  width: 100%;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--panel-2);
  color: var(--text);
  font: inherit;
  outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.results {
  position: absolute;
  top: 42px;
  right: 0;
  width: 100%;
  min-width: 300px;
  max-height: 60vh;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0;
  box-shadow: var(--shadow);
  padding: 6px;
}
.results button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 7px 10px;
  border-radius: 0;
  cursor: pointer;
}
.results button:hover, .results button.on { background: var(--accent-soft); }
.results .r-name { font-family: var(--mono); font-weight: 600; }
.results .r-sub { display: block; color: var(--muted); font-size: 12px; }
.results .empty { padding: 10px; color: var(--muted); }
.icon-btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 0;
  height: 32px;
  min-width: 32px;
  padding: 0 9px;
  cursor: pointer;
}
.icon-btn:hover { background: var(--panel-2); }
.menu-btn { display: none; }

/* ---------- 레이아웃 ---------- */
:root { --gnb-h: 46px; }
.layout { display: flex; height: calc(100% - 56px - var(--gnb-h)); position: relative; }
.main { flex: 1; min-width: 0; overflow: auto; position: relative; }
.scrim { display: none; }

/* ---------- 상단 영역 메뉴 (GNB): 영역 → 묶음 드롭다운 ---------- */
.gnb {
  height: var(--gnb-h);
  display: flex;
  align-items: stretch;
  gap: 4px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 19;
}
.gnb-home, .gnb-h {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.gnb-home:hover, .gnb-h:hover { text-decoration: none; }
.gnb-home.on, .gnb-item.on > .gnb-h { border-bottom-color: var(--line-strong); }
.gnb-h .dot { width: 6px; height: 6px; }
.gnb-h .n, .gnb-g .n { color: var(--muted); font-size: 12px; font-weight: 400; }
.gnb-item { position: relative; display: flex; }
/* 1뎁스(영역)에 올리면 묶음별 열 + 그 아래 테이블 전체 (메가 메뉴) */
.gnb-drop {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  padding: 14px 0 16px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  z-index: 40;
}
.gnb-item:hover > .gnb-drop, .gnb-item:focus-within > .gnb-drop { display: block; }
.gnb.closing .gnb-drop { display: none; }
.gnb-all {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 20px 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  font-weight: 800;
  color: var(--text);
  white-space: nowrap;
}
.gnb-all:hover { text-decoration: underline; text-underline-offset: 3px; }
.gnb-all.on { text-decoration: underline; text-underline-offset: 3px; }
.gnb-all .n { color: var(--muted); font-size: 12px; font-weight: 400; }
.gnb-cols { display: flex; padding: 0 8px; }
.gnb-col { min-width: 190px; padding: 0 4px; }
.gnb-col + .gnb-col { border-left: 1px solid var(--line); }
.gnb-g {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 12px;
  margin-bottom: 4px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.gnb-g:hover { background: var(--panel-2); text-decoration: none; }
.gnb-g.on { background: var(--accent); color: var(--on-accent); }
.gnb-g.on .n { color: var(--on-accent); opacity: .7; }
.gnb-t { display: block; padding: 4px 12px; font-size: 13px; color: var(--sub); white-space: nowrap; }
.gnb-t:hover { color: var(--text); background: var(--panel-2); text-decoration: none; }
.gnb-t.on { color: var(--text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.stage-col h2 a { color: inherit; }
.stage-col h2 a:hover { color: var(--c); }

/* ---------- 개요 ---------- */
.overview { padding: 28px 28px 40px; }
.overview h1 { font-size: 24px; margin: 0 0 6px; }
.overview .lead { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
.stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
.stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 12px 16px;
  min-width: 140px;
}
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12.5px; }
.ov-h { font-size: 17px; margin: 26px 0 4px; display: flex; align-items: baseline; gap: 10px; }
.ov-h span { color: var(--muted); font-size: 13px; font-weight: 400; }
.ov-sub { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.ov-erd { border: 1px solid var(--line); border-radius: 0; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
.ov-erd .toolbar { border-top: 0; padding: 8px 14px; }
.ov-erd .canvas { border-bottom: 0; }
.canvas g.cluster { cursor: pointer; }
.canvas g.cluster:hover > path, .canvas g.cluster:hover > polygon { stroke-width: 2.4; }
.stage-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1500px) { .stage-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stage-col {
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 4px solid var(--c);
  border-radius: 0;
  padding: 14px;
  box-shadow: var(--shadow);
}
.stage-col h2 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; }
.stage-col h2 span { color: var(--muted); font-weight: 500; font-size: 13px; }
.g-card {
  display: block;
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 10px 12px;
  margin-top: 10px;
  background: var(--panel-2);
  color: var(--text);
}
.g-card:hover { border-color: var(--c); text-decoration: none; }
.g-card b { display: block; }
.g-card p { margin: 3px 0 8px; color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 1px 6px;
  border-radius: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--muted);
}
/* 벤치마킹 개요 */
.bench { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1100px) { .bench { grid-template-columns: 1fr; } }
.bench-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 4px solid var(--s3);
  border-radius: 0;
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.bench-card h3 { margin: 0 0 10px; font-size: 15px; }
.bench-card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
.bench-card dt { color: var(--muted); font-weight: 600; white-space: nowrap; }
.bench-card dd { margin: 0; }
.bench-card ul { margin: 0; padding-left: 18px; font-size: 13px; }
.bench-card li { margin: 4px 0; }
.bench-src { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.legend {
  margin-top: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 14px 18px;
}
.legend h3 { margin: 0 0 8px; font-size: 14px; }
.legend ul { margin: 0; padding-left: 18px; color: var(--muted); }
.legend li { margin: 3px 0; }

/* ---------- 영역 화면: ERD ---------- */
.g-view { padding-bottom: 48px; }
.g-head { padding: 18px 22px 12px; }
.g-head .crumb { font-size: 12px; font-weight: 700; color: var(--c); }
.g-head h1 { font-size: 20px; margin: 2px 0 4px; }
.g-head p { margin: 0; color: var(--muted); max-width: 900px; }
.g-head .ext { font-size: 12.5px; margin-top: 6px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.jump a {
  font-family: var(--mono);
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 0;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
}
.jump a:hover { border-color: var(--c); text-decoration: none; }
.jump a.on { border-color: var(--hl); color: var(--hl); font-weight: 600; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 22px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  flex-wrap: wrap;
}
.toolbar .zoom { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.toolbar .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
.canvas {
  height: 62vh;
  min-height: 200px;
  overflow: auto;
  resize: vertical;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  cursor: grab;
  position: relative;
}
.canvas.drag { cursor: grabbing; user-select: none; }
.canvas .pad { padding: 24px; display: inline-block; min-width: 100%; }
.canvas svg { display: block; margin: 0 auto; }
.canvas svg text[font-family="Consolas"] { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; }
.canvas svg text[font-family="Malgun Gothic"] { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
.canvas g.node { cursor: pointer; }
.canvas g.node text { cursor: help; }
.canvas g.node:hover rect.box { stroke: #999999; }
.canvas g.node.sel rect.box { stroke: #8a8a8a; }
.canvas g.node:hover rect.hd, .canvas g.node.sel rect.hd { filter: brightness(.78); }
.canvas g.node.sel rect.hd { stroke: var(--text); stroke-width: 3; }
.canvas.has-sel g.node:not(.sel):not(.rel) { opacity: .35; }
.canvas.has-sel g.edge:not(.rel) { opacity: .15; }
.canvas g.edge.rel path { stroke: #111111; stroke-width: 2; }
.canvas g.edge.rel polygon, .canvas g.edge.rel polyline, .canvas g.edge.rel ellipse { stroke: #111111; }

/* ---------- ERD 마우스 팝업 (테이블 기능 설명) ---------- */
.tip {
  position: fixed;
  z-index: 60;
  max-width: min(380px, calc(100vw - 16px));
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 0;
  box-shadow: 0 6px 24px rgba(20, 30, 45, .18);
  padding: 10px 12px;
  font-size: 12.5px;
  line-height: 1.5;
  pointer-events: none;
}
.tip-h { display: flex; align-items: baseline; gap: 8px; }
.tip-h code { font-size: 13.5px; font-weight: 700; }
.tip-h span { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tip-note { margin: 4px 0 0; }
.tip-col, .tip-list, .tip-foot { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.tip-col code { font-weight: 600; }
.tip-type { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.tip-ref { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
.tip-list { list-style: none; padding-left: 0; margin-bottom: 0; }
.tip-list li { padding: 1px 0; }
.tip-more, .tip-foot { color: var(--muted); font-size: 11.5px; }
.tip .badge { margin-right: 0; }

/* ---------- 영역 화면: 테이블 명세 ---------- */
.specs { padding: 8px 22px 0; }
.specs-h { font-size: 16px; margin: 18px 0 4px; }
.spec {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0;
  margin-top: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
  scroll-margin-top: 12px;
}
.spec.sel { border-color: var(--hl); box-shadow: 0 0 0 2px var(--hl), var(--shadow); }
.spec-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 0;
  flex-wrap: wrap;
}
.spec-h .no {
  min-width: 24px;
  height: 24px;
  border-radius: 0;
  background: var(--c);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.spec-h h3 { margin: 0; font-family: var(--mono); font-size: 16px; word-break: break-all; }
.spec-h .cnt { color: var(--muted); font-size: 12.5px; }
.spec-h .to-erd { margin-left: auto; font-size: 12px; height: 28px; }
.spec .tnote { margin: 6px 16px 10px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
.cols { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cols th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  background: var(--panel-2);
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.cols td { border-top: 1px solid var(--line); padding: 7px 10px; vertical-align: top; }
.cols tbody tr:first-child td { border-top: 0; }
.cols tr.is-pk td { background: color-mix(in srgb, var(--pk-soft) 55%, transparent); }
.cols tbody tr:hover td { background: var(--accent-soft); }
.cols .c-name { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.cols .c-type { font-family: var(--mono); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.cols .c-key { white-space: nowrap; }
.cols .c-nn { text-align: center; color: var(--muted); }
.cols .c-def { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.cols .c-desc { min-width: 260px; line-height: 1.5; }
.cols .c-ref { font-size: 11.5px; margin-bottom: 2px; }
.cols .c-ref code { font-size: 11.5px; }
.badge {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  padding: 0 5px;
  border-radius: 0;
  margin-right: 3px;
  line-height: 17px;
}
.badge.PK { color: var(--pk); background: var(--pk-soft); }
.badge.FK { color: var(--fk); background: var(--fk-soft); }
.badge.UK { color: var(--uk); background: var(--uk-soft); }
.badge.AI { color: var(--s1); background: var(--panel-2); border: 1px solid var(--line); line-height: 15px; }
.spec-foot {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

}

/* ---------- 좁은 화면 ---------- */
@media (max-width: 1100px) {

}

  .gnb-h { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-top: 8px; }
  .gnb-drop, .gnb.closing .gnb-drop { display: block; position: static; border: 0; padding: 0; }
  /* 좁은 화면 패널은 묶음까지만 (테이블은 묶음 화면의 탭 줄) */
  .gnb-all, .gnb-t { display: none; }

  /* 컬럼 표 → 행마다 카드형으로 쌓기 (설명이 가로 스크롤 밖으로 밀리지 않게) */
  .tbl-wrap { overflow: visible; }
  .cols thead { display: none; }
  .cols, .cols tbody { display: block; }
  .cols tr { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .cols tbody tr:first-child { border-top: 0; }
  .cols tr.is-pk { background: color-mix(in srgb, var(--pk-soft) 55%, transparent); }
  .cols td, .cols tr.is-pk td, .cols tbody tr:hover td { border: 0; padding: 0; background: none; }
  .cols .c-type { text-align: right; }
  .cols .c-nn { display: none; }
  .cols .c-key:empty, .cols .c-def:empty, .cols .c-desc:empty { display: none; }
  .cols .c-def { grid-column: 1 / -1; }
  .cols .c-def::before { content: '기본값 '; font-family: inherit; }

  .results { min-width: 0; }
}

/* 논리명 (한글 이름) */
.cols .c-lg { white-space: nowrap; }
/* 논리명 우선: 물리명은 작은 회색 고정폭 */
code.phys { font-family: var(--mono); font-size: .82em; color: var(--muted); font-weight: 400; background: none; padding: 0; }
.spec-h h3 code.phys { margin-left: 4px; }
.cols .c-lg { font-weight: 600; }
.cols .c-name { font-weight: 400 !important; color: var(--muted); font-size: .9em; }
.tip-h b { font-weight: 700; }
/* 논리명(한글) 목록은 일반 글꼴로 */
.chips span, .jump a, .results .r-name, .tip-ref { font-family: inherit; }
.spec-h h3 { font-family: inherit; }

/* 테이블 드래그 배치 */
.canvas g.node { cursor: grab; }
.canvas.drag-node, .canvas.drag-node g.node { cursor: grabbing; user-select: none; }
.toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.toolbar a.icon-btn { text-decoration: none; color: inherit; }

/* ---------- W컨셉 무드 (모노톤 · 각진 형태 · 굵은 제목) ---------- */
body { letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
a:hover { text-decoration: none; }
.brand { gap: 10px; font-size: 19px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; }
.brand .logo { display: none; }
.brand small { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--muted); }
.meta { font-size: 12px; }
.search input { border: 0; background: var(--panel-2); height: 38px; padding: 0 14px; }
.search input:focus { box-shadow: none; outline: 1px solid var(--line-strong); }
.icon-btn { border-color: var(--line); background: var(--panel); font-size: 13px; }
.icon-btn:hover { background: var(--panel); border-color: var(--line-strong); }
.results { box-shadow: 0 8px 24px rgba(0, 0, 0, .08); }
.results button:hover, .results button.on { background: var(--panel-2); }

/* 개요: 잡지처럼 큰 제목, 카드 대신 선 */
.overview { padding: 44px 48px 64px; }
.overview h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 10px; }
.overview .lead { font-size: 15px; color: var(--sub); max-width: 820px; margin-bottom: 28px; }
.stats { gap: 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.stat { border: 0; border-right: 1px solid var(--line); padding: 18px 28px 18px 0; margin-right: 28px; min-width: 0; background: none; }
.stat:last-child { border-right: 0; }
.stat b { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.stat span { font-size: 12px; }
.ov-h { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 48px 0 6px; }
.ov-h span { font-size: 13px; }
.ov-sub { margin-bottom: 16px; }
.ov-erd { border: 1px solid var(--line); box-shadow: none; }
.stage-col, .bench-card { border: 0; border-top: 2px solid var(--line-strong); box-shadow: none; padding: 18px 0 0; background: none; }
.stage-col h2 { font-size: 18px; font-weight: 800; }
.g-card { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; }
.g-card:hover { border-color: var(--line-strong); }
.chips span { background: var(--panel-2); border: 0; padding: 2px 8px; }
.bench { gap: 32px; }
.bench-card h3 { font-size: 16px; font-weight: 800; margin-bottom: 14px; }
.bench-card dt { color: var(--text); }
.bench-card dd, .bench-card li { color: var(--sub); }
.bench-card li b { color: var(--text); }
.legend { border: 0; border-top: 2px solid var(--line-strong); padding: 18px 0 0; margin-top: 48px; background: none; }
.legend h3 { font-size: 16px; font-weight: 800; }

/* 영역 화면 */
.g-head { padding: 32px 32px 16px; }
.g-head .crumb { color: var(--muted); letter-spacing: 0.1em; font-size: 11px; }
.g-head h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
.jump a { border-color: var(--line); padding: 5px 12px; }

.toolbar { padding: 10px 32px; }
.specs { padding: 16px 32px 0; }
.specs-h { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-top: 28px; }
.spec { border: 0; border-top: 2px solid var(--line-strong); box-shadow: none; margin-top: 36px; }
.spec.sel { box-shadow: none; outline: 0; border-top-width: 5px; }
.spec-h { padding: 14px 10px 0; }
.spec-h .no { background: var(--accent); color: var(--on-accent); }

.cols th { background: none; color: var(--text); font-weight: 700; border-bottom: 1px solid var(--line-strong); }
.cols tr.is-pk td { background: var(--panel-2); }
.cols tbody tr:hover td { background: var(--panel-2); }
.spec-foot { background: none; padding: 6px 10px 14px; }

@media (max-width: 760px) {
  .overview { padding: 24px 16px 40px; }
  .overview h1 { font-size: 26px; }

/* 다크/라이트 전환 버튼 (헤더 오른쪽 끝) */
.theme-btn { flex: none; height: 38px; min-width: 64px; padding: 0 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; border-color: var(--line-strong); }
.theme-btn:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
@media (max-width: 760px) { .theme-btn { height: 32px; min-width: 0; padding: 0 8px; } }

/* 콘텐츠 영역 미색: 헤더·사이드바는 흰색, 본문은 #f5f5f5. ERD 캔버스는 흰 종이처럼 유지 */
.main { background: var(--content); }
.toolbar { background: transparent; }
.g-card { background: var(--panel); }
.chips span, .cols tr.is-pk td { background: var(--content-2); }
/* 행 hover는 PK 행(옅은 회색 바탕)과 구분: 더 옅은 바탕 + 왼쪽 검정 2px 선. PK 행 위에서는 바탕을 유지하고 선만 */
.cols tbody tr:hover td { background: var(--row-hover); }
.cols tbody tr.is-pk:hover td { background: var(--content-2); }
.cols tbody tr:hover td:first-child { box-shadow: inset 2px 0 0 var(--line-strong); }
.main .icon-btn { background: var(--panel); }

/* ---------- 로컬 편집 모드 (edit-server.js 화면에서만 보임) ---------- */
.ed-mode { font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; background: var(--accent); color: var(--on-accent); }
.ed-btn { font-size: 12px; height: 26px; }
.spec-h .ed-bar { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.spec-h .ed-bar + .to-erd { margin-left: 0; }
h1 .ed-btn { vertical-align: middle; margin-left: 8px; }
.ed-x { margin-left: 6px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 1px 5px; border-radius: 0; visibility: hidden; }
tr:hover .ed-x, .ed-x:focus-visible, .ed-x.on { visibility: visible; }
.ed-row { white-space: nowrap; }
.ed-x:hover { color: var(--text); border-color: var(--line-strong); }
.ed-panel { position: fixed; z-index: 80; top: calc(56px + var(--gnb-h)); right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel); border-left: 1px solid var(--line-strong); overflow-y: auto; }
.ed-form { display: flex; flex-direction: column; min-height: 100%; }
.ed-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.ed-h h3 { margin: 0; font-size: 15px; }
.ed-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.ed-f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.ed-f > span { font-weight: 600; }
.ed-f input, .ed-f select { height: 34px; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--text); padding: 0 10px; font: inherit; }
.ed-f input:focus, .ed-f select:focus { outline: none; border-color: var(--line-strong); }
.ed-f input[name="name"], .ed-f input[name="type"], .ed-f input[name="pkName"], .ed-f input[name="pkType"] { font-family: var(--mono); }
.ed-f small, .ed-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }
.ed-c { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.ed-sub { margin: 6px 0 0; font-size: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
.ed-q { margin: 0; font-size: 14px; line-height: 1.6; }
.ed-msg { margin: 0 18px; padding: 10px 12px; font-size: 13px; background: var(--panel-2); border-left: 2px solid var(--line-strong); }
.ed-msg.err { border-left-color: #c62828; color: #c62828; }
.ed-act { display: flex; gap: 8px; padding: 14px 18px 18px; margin-top: auto; border-top: 1px solid var(--line); }
.ed-ok { background: var(--accent); color: var(--on-accent); border-color: var(--accent); padding: 0 18px; }
.ed-ok:hover { background: var(--accent); opacity: .85; }
.ed-ok.danger { background: #c62828; border-color: #c62828; color: #fff; }
.ed-ok:disabled { opacity: .5; cursor: wait; }
.ed-pick { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; border: 1px solid var(--line); padding: 10px; }
.ed-pick .phys { font-size: 11px; }
.ed-order { margin: 0; font-size: 13px; }
.ed-order b { font-family: var(--mono); font-weight: 600; }
.ed-hint { color: var(--muted); font-size: 12px; }
.ed-more { align-self: flex-start; font-size: 12px; height: 28px; }
.ed-f select { font-size: 13px; }
.ed-panel.wide { width: min(1040px, 100vw); }
.ed-f input.mono, .ed-grid input.mono { font-family: var(--mono); }
.ed-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ed-grid { width: 100%; border-collapse: collapse; font-size: 13px; }
.ed-grid th { text-align: left; font-size: 12px; font-weight: 600; color: var(--sub); padding: 0 4px 6px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.ed-grid td { padding: 4px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ed-grid td.c { text-align: center; }
.ed-grid input:not([type=checkbox]), .ed-grid select { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--text); padding: 0 8px; font: inherit; font-size: 13px; }
.ed-grid input:focus, .ed-grid select:focus { outline: none; border-color: var(--line-strong); }
.ed-grid select:disabled { opacity: .35; }
.ed-grid th:nth-child(1) { width: 18%; } .ed-grid th:nth-child(2) { width: 18%; } .ed-grid th:nth-child(3) { width: 9%; }
.ed-grid th:nth-child(4) { width: 20%; } .ed-grid th:nth-child(5) { width: 12%; } .ed-grid th:nth-child(6) { width: 4%; } .ed-grid th:nth-child(8) { width: 3%; }
.ed-grid-foot { display: flex; gap: 12px; align-items: center; }
.ed-grid-foot small { color: var(--muted); font-size: 12px; line-height: 1.5; }
/* 컬럼 순서 드래그 (편집 모드) */
.ed-drag { display: inline-block; width: 14px; margin-right: 6px; color: var(--muted); cursor: grab; user-select: none; visibility: hidden; }
tr:hover .ed-drag { visibility: visible; }
tr.ed-dragging { opacity: .35; }
tr.ed-drop-before td { box-shadow: inset 0 2px 0 var(--text); }
tr.ed-drop-after td { box-shadow: inset 0 -2px 0 var(--text); }
.ed-toast { position: fixed; z-index: 90; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(640px, 90vw); padding: 10px 16px; background: var(--text); color: var(--bg); font-size: 13px; border-radius: 0; }
.ed-toast.err { background: #b00020; color: #fff; }
.ed-drag.off { cursor: default; }

/* ---------- 콘텐츠 폭 제한 (1920에서도 1520px 안에 정렬, 바 배경·선은 전체 폭) ---------- */
:root { --wrap: 1440px; --gutter: max(32px, calc((100vw - var(--wrap)) / 2)); }
.top, .gnb { padding-left: var(--gutter); padding-right: var(--gutter); }
.gnb { padding-left: calc(var(--gutter) - 16px); } /* 메뉴 글자를 로고 왼쪽 선에 맞춤 (항목 안쪽 여백 16px) */
.overview, .g-view { width: min(var(--wrap), 100% - 64px); margin-left: auto; margin-right: auto; }
.overview { padding-left: 0; padding-right: 0; }
.g-head, .toolbar, .specs { padding-left: 0; padding-right: 0; }
.g-view .canvas { border: 1px solid var(--line); }
@media (max-width: 760px) {
  :root { --gutter: 16px; }
  .gnb { padding-left: 0; padding-right: 0; }
  .overview, .g-view { width: calc(100% - 32px); }
}

/* ---------- 영역 포인트 색 (모노톤 위에 살짝): 묶음 화면은 --c = 그 영역 색 ---------- */
.g-head .crumb { color: var(--c); }
.g-view .spec { border-top-color: var(--c); }
.g-view .spec-h .no { background: var(--c); color: var(--on-accent); }
.g-view .jump a.on { background: var(--c); border-color: var(--c); color: var(--on-accent); }
.stage-col { border-top-color: var(--c); }
.gnb-h .dot { width: 8px; height: 8px; }
/* ERD 도화지는 다크 모드에서도 밝은 종이색이라, 도화지 안 제목줄은 항상 진한 톤 */
.canvas { --s1: #4f6378; --s2: #7d6c4f; --s3: #5e7663; --s4: #8e5d4c; --s5: #4d4d57; }

/* ---------- 리모컨: 콘텐츠(1440) 왼쪽 여백에 고정된 테이블 바로가기. 여백이 충분한 넓은 화면에서만 ---------- */
.remote { display: none; }
@media (min-width: 1840px) {
  .remote:not([hidden]) {
    display: block;
    position: fixed;
    z-index: 15;
    top: calc(56px + var(--gnb-h) + 40px);
    left: calc((100vw - var(--wrap)) / 2 - 184px);
    width: 160px;
    max-height: calc(100vh - 56px - var(--gnb-h) - 80px);
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px 0;
    font-size: 13px;
  }
}
.rm-h { padding: 0 14px 10px; margin-bottom: 6px; border-bottom: 2px solid var(--c); font-weight: 800; }
.rm-g { padding: 10px 14px 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.rm-t, .rm-erd, .rm-top {
  display: block;
  width: 100%;
  padding: 5px 14px;
  border: 0;
  border-left: 2px solid transparent;
  background: none;
  color: var(--sub);
  text-align: left;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rm-t:hover, .rm-erd:hover, .rm-top:hover { color: var(--text); background: var(--panel-2); text-decoration: none; }
.rm-t.on, .rm-erd.on { color: var(--text); font-weight: 700; border-left-color: var(--text); }
.rm-erd { font-weight: 600; }
.rm-top { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

/* 시스템 컬럼(등록·수정 일시/관리자)은 연하게: 필요한 컬럼 위주로 읽히게 (사용자 요청) */
:root { --sys-1: #666; --sys-2: #999; }
:root[data-theme="dark"] { --sys-1: #8a8a8a; --sys-2: #666; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sys-1: #8a8a8a; --sys-2: #666; } }
.cols tr.is-sys td { color: var(--sys-2); }
.cols tr.is-sys .c-lg { color: var(--sys-1); font-weight: 400; }
.cols tr.is-sys .c-name, .cols tr.is-sys .c-type, .cols tr.is-sys .c-def, .cols tr.is-sys .c-nn { color: var(--sys-2); }
.cols tr.is-sys .badge { opacity: .55; }

/* GNB 드롭다운 반응형: 화면 폭을 넘지 않게, 열이 다 안 들어가면 다음 줄로 (위치는 erd.js placeDrop이 화면 안으로 당김) */
@media (min-width: 761px) {
  .gnb-drop { width: max-content; max-width: calc(100vw - 32px); }

"logical":"등록일시","note":"취소 요청일시"},{"name":"updated_at","type":"DATETIME","keys":[],"nn":false,"def":"","inc":false,"ref":"","logical":"수정일시","note":"취소 상태 변경일시"}],"indexes":[{"name":"","pk":true,"unique":false,"cols":"order_no, payment_no, cancel_no","note":"(order_no, payment_no) 선두라 결제 FK 인덱스 겸용"},{"name":"ix_payment_cancel_reason","pk":false,"unique":false,"cols":"cancel_reason_type, created_at","note":"취소 사유별 집계"}],"out":[{"col":"payment_no","table":"payment","pcol":"payment_no","one":false}],"in":[{"table":"payment_cancel_item","col":"cancel_no","one":false}]},"payment_cancel_item":{"name":"payment_cancel_item","group":"payment_basic","logical":"결제 취소 상세","note":"결제 취소 내역의 상세 줄(주문 → 주문 상세와 같은 헤더-상세 관계). 취소 1회에 포함된 주문 상세와 수량. 한 번에 여러 상품을 취소해도 PG 취소는 1번이라 회차로 묶음. 수량 일부 취소(2개 중 1개)도 가능, 주문 상세 상태는 수량을 모두 취소하면 CANCELLED(앱)","fields":[{"name":"order_no","type":"VARCHAR(20)","keys":["PK"],"nn":true,"def":"","inc":false,"ref":"","logical":"주문 번호","note":"취소한 주문"},{"name":"payment_no","type":"SMALLINT","keys":["PK"],"nn":true,"def":"","inc":false,"ref":"","logical":"결제 번호","note":"취소한 결제"},{"name":"cancel_no","type":"SMALLINT","keys":["PK","FK"],"nn":true,"def":"","inc":false,"ref":"payment_cancel.cancel_no","logical":"취소 번호","note":"이 상품이 포함된 취소 회차"},{"name":"item_no","type":"SMALLINT","keys":["PK","FK"],"nn":true,"def":"","inc":false,"ref":"order_item.item_no","logical":"주문 상세 번호","note":"취소한 주문 상세"},{"name":"quantity","type":"SMALLINT","keys":[],"nn":true,"def":"","inc":false,"ref":"","logical":"수량","note":"이번에 취소한 수량. CHECK (quantity >= 1). 같은 주문 상세의 취소 수량 합계는 주문 수량 이하(앱 검증)"},{"name":"cancel_amount","type":"BIGINT","keys":[],"nn":true,"def":"","inc":false,"ref":"","logical":"취소 금액","note":"이 상품 몫의 환불액 = (판매가 + 추가 금액) × 취소 수량 - 배분된 할인 - 배분된 포인트. 회차 취소 금액 = 상품 몫 합계 - 배송비 차감 금액(앱)"},{"name":"point_refund_amount","type":"BIGINT","keys":[],"nn":true,"def":"0","inc":false,"ref":"","logical":"포인트 환원 금액","note":"이 상품 몫으로 포인트로 돌려준 금액"},{"name":"created_at","type":"DATETIME","keys":[],"nn":true,"def":"CURRENT_TIMESTAMP","inc":false,"ref":"","logical":"등록일시","note":"취소 요청일시"},{"name":"updated_at","type":"DATETIME","keys":[],"nn":false,"def":"","inc":false,"ref":"","logical":"수정일시","note":"결제 취소 상세 수정일시"}],"indexes":[{"name":"","pk":true,"unique":false,"cols":"order_no, payment_no, cancel_no, item_no","note":"취소 회차 FK 인덱스 겸용"},{"name":"ix_payment_cancel_item_order_item","pk":false,"unique":false,"cols":"order_no, item_no","note":"주문 상세 FK 인덱스, 주문 상세별 취소 수량 합계"}],"out":[{"col":"cancel_no","table":"payment_cancel","pcol":"cancel_no","one":false},{"col":"item_no","table":"order_item","pcol":"item_no","one":false}],"in":[]}},"counts":{"tables":36,"refs":46,"groups":12},"layout":{}};</script>
<script>(function () {
  'use strict';
  const D = window.ERD;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const gnb = $('#gnb'), remote = $('#remote'), main = $('#main'), q = $('#q'), results = $('#results');

  const stageOf = (g) => D.stages.findIndex((s) => g.startsWith(s.prefix + '_'));
  const stageColor = (g) => `var(--s${stageOf(g) + 1})`;
  const PT = 4 / 3; // Graphviz pt → px
  // draw.io에서 열기: GitHub Pages(http)에서만. 이 페이지(…/erd/) 옆의 ../erd.drawio를 diagrams.net이 직접 불러옴
  const DRAWIO = /^https?:$/.test(location.protocol)
    ? 'https://app.diagrams.net/#U' + encodeURIComponent(new URL('../erd.drawio', location.href).href)
    : '';

  const EDIT = !!window.ERD_EDIT; // 로컬 편집 모드 (edit-server.js). 공개 페이지에서는 false

  let cur = { g: null, t: null };
  const zoomOf = {}; // 영역별 확대 비율 유지
  const manual = {}; // 사용자가 직접 확대/축소한 영역 (아니면 창 크기·상세 패널에 맞춰 다시 맞춤)

  // ---------- 라우팅: #g=영역&t=테이블 / #t=테이블 / (없음)=개요 ----------
  function parseHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    let g = p.get('g'), t = p.get('t');
    if (t && !D.tables[t]) t = null;
    if (g && !D.groups[g]) g = null;
    if (t && !g) g = D.tables[t].group;
    return { g, t };
  }
  function go(g, t) {
    const h = g ? `#g=${g}${t ? `&t=${t}` : ''}` : t ? `#t=${t}` : '#';
    if (location.hash === h || (h === '#' && !location.hash)) route();
    else location.hash = h;
  }
  function route() {
    const next = parseHash();
    const groupChanged = next.g !== cur.g || !main.firstChild;
    cur = next;
    if (groupChanged) next.g ? renderGroup(next.g) : renderOverview();
    renderGnb();
    if (groupChanged) renderRemote();
    selectTable(next.t);
    document.body.classList.remove('side-open');
    syncMenu();
  }

  // ---------- 상단 영역 메뉴 (GNB): 영역 → 묶음 드롭다운. 테이블은 묶음 화면의 탭 줄(.jump) ----------
  function renderGnb() {
    const curStage = cur.g ? stageOf(cur.g) : -1;
    let h = `<a class="gnb-home${cur.g ? '' : ' on'}" href="#">전체 개요</a>`;
    D.stages.forEach((s, i) => {
      const n = s.groups.reduce((a, g) => a + D.groups[g].tables.length, 0);
      h += `<div class="gnb-item${i === curStage ? ' on' : ''}">
        <a class="gnb-h${s.all === cur.g ? ' sel' : ''}" href="#g=${s.all}" title="${esc(s.name)} 전체 ERD 보기" aria-haspopup="true"><span class="dot" style="background:var(--s${i + 1})"></span>${esc(s.name)}<span class="n">${n}</span></a>
        <div class="gnb-drop">
          <a class="gnb-all${s.all === cur.g ? ' on' : ''}" href="#g=${s.all}">${esc(s.name)} 전체 ERD<span class="n">${n}개 테이블</span></a>
          <div class="gnb-cols">${s.groups.map((g) => `<div class="gnb-col">
            <a class="gnb-g${g === cur.g ? ' on' : ''}" href="#g=${g}"><span>${esc(D.groups[g].title)}</span><span class="n">${D.groups[g].tables.length}</span></a>
            ${D.groups[g].tables.map((t) => `<a class="gnb-t${g === cur.g && t === cur.t ? ' on' : ''}" href="#g=${g}&t=${t}" title="${t}">${esc(tLg(t))}</a>`).join('')}
          </div>`).join('')}</div>
        </div>
      </div>`;
    });
    gnb.innerHTML = h;
  }
  // 메뉴를 누른 뒤에는 드롭다운을 닫는다 (hover·focus가 남아 열려 있지 않게)
  gnb.addEventListener('click', (e) => {
    if (!e.target.closest('a')) return;
    gnb.classList.add('closing');
    if (document.activeElement && gnb.contains(document.activeElement)) document.activeElement.blur();
  });
  gnb.addEventListener('mouseleave', () => gnb.classList.remove('closing'));
  // 드롭다운이 화면 오른쪽 밖으로 나가면 왼쪽으로 당긴다 (좁은 화면에서 상품처럼 묶음이 많은 영역이 잘리지 않게)
  const placeDrop = (e) => {
    const item = e.target.closest && e.target.closest('.gnb-item');
    if (!item) return;
    const drop = item.querySelector('.gnb-drop');
    drop.style.left = '0px';
    requestAnimationFrame(() => {
      const r = drop.getBoundingClientRect();
      if (!r.width) return;
      const over = r.right - (document.documentElement.clientWidth - 16);
      if (over > 0) drop.style.left = -Math.min(over, r.left - 16) + 'px';
    });
  };
  gnb.addEventListener('mouseover', placeDrop);
  gnb.addEventListener('focusin', placeDrop);
  gnb.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.activeElement && gnb.contains(document.activeElement)) document.activeElement.blur();
  });

  // ---------- 리모컨: 넓은 화면에서 콘텐츠 왼쪽 여백에 떠 있는 테이블 바로가기 (사용자 요청) ----------
  function renderRemote() {
    const G = cur.g && D.groups[cur.g];

    const item = (t) => `<a class="rm-t" href="#g=${cur.g}&t=${t}" data-t="${t}" title="${t}">${esc(tLg(t))}</a>`;
    let list;
    if (G.area) { // 영역 전체: 묶음별로 나눠서
      const by = {};
      G.tables.forEach((t) => (by[D.tables[t].group] = by[D.tables[t].group] || []).push(t));
      list = Object.entries(by).map(([g, ts]) => `<div class="rm-g">${esc(D.groups[g].title)}</div>${ts.map(item).join('')}`).join('');
    } else list = G.tables.map(item).join('');
    remote.innerHTML = `<div class="rm-h" style="--c:${stageColor(G.area ? D.tables[G.tables[0]].group : cur.g)}">${esc(G.title)}</div>
      <button type="button" class="rm-erd" data-rm="erd">ERD</button>
      <div class="rm-list">${list}</div>
      <button type="button" class="rm-top" data-rm="top">맨 위로 ↑</button>`;
    remote.hidden = false;
    spy();
  }
  remote.addEventListener('click', (e) => {
    const a = e.target.closest('a.rm-t');
    if (a) { e.preventDefault(); go(cur.g, a.dataset.t); return; }
    const b = e.target.closest('[data-rm]');
    if (!b) return;
    const canvas = $('.canvas', main);
    main.scrollTo({ top: b.dataset.rm === 'erd' && canvas ? Math.max(0, canvas.offsetTop - 120) : 0, behavior: 'smooth' });
  });
  // 스크롤 위치에 맞춰 지금 보고 있는 테이블 표시
  function spy() {
    if (remote.hidden) return;
    const top = main.getBoundingClientRect().top + 140;

    main.querySelectorAll('.spec').forEach((c) => { if (c.getBoundingClientRect().top <= top) on = c.id.replace(/^spec-/, ''); });
    remote.querySelectorAll('.rm-t').forEach((a) => a.classList.toggle('on', a.dataset.t === on));
    const erd = remote.querySelector('.rm-erd');

      s.groups.forEach((g) => {

        <li>선 끝 모양: 까마귀발 = 여러 개(N), 세로줄 = 반드시 1개, 동그라미 = 없을 수 있음(0).</li>

  // ---------- 영역 화면: ERD + 테이블 명세 ----------
  let view = null; // { svg, w, h, canvas, zoomEl, g }
  // 구조 설계 단계라 논리명(한글)을 앞에, 물리명은 작은 회색 고정폭으로
  const tLg = (t) => (D.tables[t] && D.tables[t].logical) || t;
  const fLg = (t, c) => { const f = D.tables[t] && D.tables[t].fields.find((x) => x.name === c); return (f && f.logical) || c; };
  const phys = (s) => `<code class="phys">${esc(s)}</code>`;
  const link = (name, col) => `<a href="#g=${D.tables[name].group}&t=${name}">${esc(tLg(name))}${col ? '.' + esc(fLg(name, col)) : ''}</a> ${phys(name + (col ? '.' + col : ''))}`;
  const keyBadges = (f) => f.keys.map((k) => `<span class="badge ${k}">${k}</span>`).join('') + (f.inc ? '<span class="badge AI">AI</span>' : '');

  const AUDIT_TAIL_COLS = ['created_by', 'updated_by', 'created_at', 'updated_at']; // 맨 끝 고정 (편집 서버와 같음)
  function specCard(t, no) {
    const T = D.tables[t];
    const movable = (f) => EDIT && !AUDIT_TAIL_COLS.includes(f.name);
    const rows = T.fields.map((f) => `<tr class="${f.keys.includes('PK') ? 'is-pk' : AUDIT_TAIL_COLS.includes(f.name) ? 'is-sys' : ''}"${EDIT ? ` data-mv-t="${t}" data-mv-c="${esc(f.name)}"` : ''}>
        <td class="c-lg">${movable(f) ? '<span class="ed-drag" title="끌어서 순서 바꾸기" aria-hidden="true">⠿</span>' : EDIT ? '<span class="ed-drag off" aria-hidden="true"></span>' : ''}${esc(f.logical || f.name)}</td>
        <td class="c-name">${esc(f.name)}${EDIT ? `<span class="ed-row"><button class="ed-x" data-ed="col-edit" data-t="${t}" data-c="${esc(f.name)}" title="이 컬럼 수정" aria-label="${esc(f.name)} 컬럼 수정">✎</button><button class="ed-x" data-ed="col-del" data-t="${t}" data-c="${esc(f.name)}" title="이 컬럼 삭제" aria-label="${esc(f.name)} 컬럼 삭제">×</button></span>` : ''}</td>
        <td class="c-type">${esc(f.type)}</td>
        <td class="c-key">${keyBadges(f)}</td>

        <td class="c-def">${esc(f.def)}</td>
        <td class="c-desc">${f.ref ? `<div class="c-ref">→ ${link(f.ref.split('.')[0], f.ref.split('.')[1])}</div>` : ''}${esc(f.note)}</td></tr>`).join('');
    const idx = T.indexes.map((i) => `<li><code>${esc(i.pk ? 'PRIMARY' : i.name)}</code> ${i.pk ? '<span class="badge PK">PK</span>' : i.unique ? '<span class="badge UK">UNIQUE</span>' : ''}
        <code class="cols-of">(${esc(i.cols)})</code>${i.note ? ` <span class="i-note">${esc(i.note)}</span>` : ''}${EDIT && !i.pk && i.name ? `<button class="ed-x on" data-ed="idx-del" data-t="${t}" data-i="${esc(i.name)}" title="이 인덱스 삭제" aria-label="${esc(i.name)} 인덱스 삭제">×</button>` : ''}</li>`).join('');
    const outs = T.out.map((r) => `<li><code>${esc(r.col)}</code> → ${link(r.table, r.pcol)}${r.one ? ' <span class="i-note">1:1</span>' : ''}${EDIT ? `<button class="ed-x on" data-ed="fk-del" data-t="${t}" data-c="${esc(r.col)}" title="이 관계 삭제" aria-label="${esc(r.col)} 관계 삭제">×</button>` : ''}</li>`).join('');
    const ins = T.in.map((r) => `<li>${link(r.table, r.col)}${r.one ? ' <span class="i-note">1:1</span>' : ''}</li>`).join('');
    return `<section class="spec" id="spec-${t}">
      <header class="spec-h">
        <span class="no">${no}</span>
        <h3>${esc(tLg(t))} ${phys(t)}</h3>
        <span class="cnt">컬럼 ${T.fields.length}</span>
        ${EDIT ? `<span class="ed-bar"><button class="icon-btn ed-btn" data-ed="col-add" data-t="${t}">+ 컬럼</button><button class="icon-btn ed-btn" data-ed="pk-set" data-t="${t}">PK 변경</button><button class="icon-btn ed-btn" data-ed="fk-add" data-t="${t}">+ FK</button><button class="icon-btn ed-btn" data-ed="idx-add" data-t="${t}">+ 인덱스</button><button class="icon-btn ed-btn" data-ed="tbl-del" data-t="${t}">테이블 삭제</button></span>` : ''}
        <button class="icon-btn to-erd" data-erd="${t}">ERD에서 보기 ↑</button>
      </header>
      <p class="tnote">${esc(T.note)}</p>
      <div class="tbl-wrap"><table class="cols">
        <thead><tr><th>논리명</th><th>물리명</th><th>타입</th><th>키</th><th>NN</th><th>기본값</th><th>설명</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="spec-foot">
        ${idx || EDIT ? `<div><h4>인덱스</h4><ul>${idx || '<li class="i-note">없음</li>'}</ul></div>` : ''}
        ${outs || EDIT ? `<div><h4>참조하는 테이블</h4><ul>${outs || '<li class="i-note">없음</li>'}</ul></div>` : ''}
        ${ins ? `<div><h4>참조받는 테이블</h4><ul>${ins}</ul></div>` : ''}
      </div>
    </section>`;
  }

  function renderGroup(g) {
    const G = D.groups[g];
    const s = D.stages[stageOf(g)];
    main.innerHTML = `<div class="g-view" style="--c:${stageColor(g)}">
      <div class="g-head">
        <div class="crumb">${esc(s.name)}</div>
        <h1>${esc(G.title)} <span style="color:var(--muted);font-weight:400;font-size:15px">${G.tables.length}개 테이블</span>${EDIT ? `${G.area ? '' : ` <button class="icon-btn ed-btn" data-ed="tbl-add" data-g="${g}">+ 테이블</button>`} <button class="icon-btn ed-btn" data-ed="grp-add" data-a="${s.prefix}">+ 묶음</button>` : ''}</h1>

      </div>
      ${toolbarHtml('테이블을 끌어 옮기기 · 빈 곳을 끌어 화면 이동 · 누르면 아래 명세로 · Ctrl + 휠로 확대')}
      <div class="canvas" id="canvas"><div class="pad"></div></div>
      <div class="specs"><h2 class="specs-h">테이블 명세</h2>${G.tables.map((t, i) => specCard(t, i + 1)).join('')}</div>
